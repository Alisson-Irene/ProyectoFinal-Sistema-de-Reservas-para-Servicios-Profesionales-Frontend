<div class="usuario-home">
  <header class="topbar">
    <a routerLink="/panel-usuario" class="marca">Sistema de Reservas</a>

    <nav class="nav-links" aria-label="Navegacion principal">
      <a routerLink="/panel-usuario" class="activo">Inicio</a>
      <a routerLink="/servicios">Reservar</a>
      <a routerLink="/mis-reservas">Mis reservas</a>
    </nav>

    <a routerLink="/perfil" class="perfil-link">Mi perfil</a>
  </header>

  <main class="dashboard-minimal">
    <section class="bienvenida">
      <div class="bienvenida-acento"></div>

      <div class="bienvenida-contenido">
        <p class="eyebrow"></p>
        <h1>Hola, {{ usuarioNombre || 'Usuario' }}</h1>
        <p class="hero-text">
          Gestiona tus reservas, agenda nuevos servicios y consulta el estado de tus citas desde un solo lugar.
        </p>

        <div class="hero-actions">
          <a routerLink="/servicios" class="btn-principal">Reservar servicio</a>
          <a routerLink="/mis-reservas" class="btn-secundario">Ver mis reservas</a>
        </div>
      </div>
    </section>
  </main>
</div>
